[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Every VITE_* value is inlined into the client bundle at build time -- that
  # is how Vite works, and Firebase web config is meant to be public. What
  # protects the data is database.rules.json, not the secrecy of these values.
  # Netlify's scanner treats any env var as a secret, so declare them as not.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_DATABASE_URL,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID"

# The app uses BrowserRouter, so the server must hand index.html to every path
# and let React Router resolve it. Without this, loading or refreshing
# /login or /app/cities directly returns a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
